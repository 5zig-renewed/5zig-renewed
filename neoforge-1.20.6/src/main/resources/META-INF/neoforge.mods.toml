modLoader="javafml"
# NeoForge 20.6.x ships FancyModLoader 3.x.
loaderVersion="[3,)"
license="GPL-3.0"

[[mods]]
modId="the5zigmod"
version="${version}"
displayName="5zig Renewed"
authors="5zig Reborn contributors, 5zig Renewed contributors"
description='''The 5zig Mod, renewed for modern Minecraft. HUD, capes, friends/chat, server tools and the plugin API. Continuation of The 5zig Mod (GPL-3.0) by 5zig Reborn.'''

# FML 3 reads mixin configs from this section (ModFileParser#getMixinConfigs); the legacy
# `MixinConfigs` manifest attribute is no longer consulted.
[[mixins]]
config="mixins.the5zigmod.json"

[[dependencies.the5zigmod]]
modId="neoforge"
type="required"
versionRange="[20.6,20.7)"
ordering="NONE"
side="CLIENT"

[[dependencies.the5zigmod]]
modId="minecraft"
type="required"
versionRange="[1.20.6,1.20.7)"
ordering="NONE"
side="CLIENT"
