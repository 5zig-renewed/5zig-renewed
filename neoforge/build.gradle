plugins {
    id 'java'
    id 'net.neoforged.gradle.userdev' version '7.1.39'
}

version = '4.0.0-alpha.1'
group = 'eu.the5zig.renewed'
base { archivesName = '5zig-renewed-1.20.1-neoforge' }

java {
    // NeoGradle's source transformer (jst) runs on the toolchain JVM and needs 21+;
    // the mod itself is still compiled to Java 17 bytecode via options.release.
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories {
    mavenCentral()
    maven { url = 'https://jitpack.io' }
}

dependencies {
    implementation 'net.neoforged:forge:1.20.1-47.1.106'

    // deps 5zig needs that Minecraft 1.20.1 does not ship
    implementation('com.github.5zig-reborn:DiscordIPC:master-SNAPSHOT') { exclude group: 'com.google.code.gson' }
    implementation 'net.sf.jacob-project:jacob:1.14.3'
    implementation 'org.json:json:20231013'
    implementation 'org.xerial:sqlite-jdbc:3.45.3.0'
    implementation 'io.netty:netty-codec-http:4.1.97.Final'
}

sourceSets {
    main {
        java {
            srcDirs = ['../core', '../common', '../api', '../platform/1.20.1', '../loader/neoforge/java']
        }
        resources {
            srcDirs = ['../core/resources', '../loader/neoforge/resources']
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

runs {
    client {
        client()
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }
}
