plugins {
    id 'fabric-loom' version '1.13.4'
}

version = '4.0.0-alpha.1'
group = 'eu.the5zig.renewed'
base { archivesName = '5zig-renewed-1.21.10-fabric' }

repositories {
    mavenCentral()
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.17.3"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.138.4+1.21.10"

    // 5zig's own deps not provided by Minecraft. httpclient used to come in transitively through
    // authlib 4; authlib 7 dropped it, and the core's Spotify/HTTP code imports it directly.
    implementation('com.github.5zig-reborn:DiscordIPC:master-SNAPSHOT') { exclude group: 'com.google.code.gson' }
    implementation 'net.sf.jacob-project:jacob:1.14.3'
    implementation 'org.json:json:20231013'
    implementation 'org.xerial:sqlite-jdbc:3.45.3.0'
    implementation 'org.apache.httpcomponents:httpclient:4.5.13'
    implementation 'io.netty:netty-codec-http:4.1.97.Final'
}

// ---------------------------------------------------------------------------------------------
// Core overlay
//
// The core was written against authlib 4 (GameProfile#getId/#getName, UserAuthentication,
// YggdrasilAuthenticationService). Minecraft 1.21.11 ships authlib 7, where GameProfile is a record
// with id()/name() and the whole legacy Yggdrasil client is gone, and commons-lang3 3.19 added
// org.apache.commons.lang3.Strings which collides with Guava's Strings in two files.
//
// Rather than editing core/ (shared with the verified 1.20.1 build), the handful of affected files
// live in compat-src/ and the rest of the core is copied into the build directory with those files
// filtered out.
// ---------------------------------------------------------------------------------------------
def coreOverlay = [
        'eu/the5zig/mod/account/AccountManager.java',
        'eu/the5zig/mod/chat/network/NetworkManager.java',
        'eu/the5zig/mod/chat/network/packets/PacketEncryption.java',
        'eu/the5zig/mod/gui/GuiHypixelStats.java',
        'eu/the5zig/mod/gui/GuiNameHistory.java',
        'eu/the5zig/mod/manager/ChatFilterManager.java',
        'eu/the5zig/mod/manager/DataManager.java',
        'eu/the5zig/mod/modules/items/server/ServerPing.java',
        'eu/the5zig/mod/server/octc/OCCListener.java',
        'eu/the5zig/mod/util/ChatHighlighting.java',
        'eu/the5zig/teamspeak/impl/ServerTabImpl.java',
        'eu/the5zig/teamspeak/util/ImageManager.java',
]

tasks.register('coreCompatTree', Sync) {
    from('../../core') {
        exclude coreOverlay
        exclude 'eu/the5zig/mod/installer/**'
    }
    into layout.buildDirectory.dir('core-compat')
}

sourceSets {
    main {
        java {
            srcDirs = [
                    'compat-src',
                    layout.buildDirectory.dir('core-compat').get().asFile.path,
                    '../../common',
                    '../../api',
                    '../../platform/1.21.10',
                    '../../loader/fabric/java',
            ]
        }
        resources {
            srcDirs = ['../../core/resources', '../../loader/fabric-1.21.10/resources', '../../loader/resources']
        }
    }
}

tasks.named('compileJava') { dependsOn 'coreCompatTree' }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

// eu.the5zig.mod.Version reads these three attributes from the first META-INF/MANIFEST.MF
// that advertises "5zig-Version"; without them the HUD and the version string fall back
// to "bDEV". Same trio as the 1.20.1 root and forge builds.
def jarManifestAttributes = [
        '5zig-Version'     : project.version,
        'Minecraft-Version': minecraft_version,
        '5zig-Build'       : 'alpha',
]

tasks.named('jar') {
    manifest { attributes(jarManifestAttributes) }
}

// Loom ships the remapped artifact, so the attributes have to be on remapJar as well.
tasks.named('remapJar') {
    manifest { attributes(jarManifestAttributes) }
}

loom {
    accessWidenerPath = file('../../loader/fabric-1.21.10/resources/5zig.accesswidener')
    // Loom 1.13 defaults `useLegacyMixinAp` to false, so nothing emitted a refmap and
    // remapJar left the mixin config without a "refmap" entry: in a real install the
    // @Inject/@Redirect targets stayed in named form and failed to resolve against the
    // intermediary-remapped game jar. Turn the Mixin annotation processor back on. It
    // writes <archivesName>-refmap.json (named -> intermediary), which Loom then nests
    // in the jar root and links from the mixin configs.
    mixin {
        useLegacyMixinAp = true
    }
    runs {
        client {
            client()
            ideConfigGenerated = true
            // headless verification hook: boot straight into the test world
            programArgs '--quickPlaySingleplayer', 'New World'
        }
    }
}

tasks.register('printCompileClasspath') {
    doLast {
        def f = file('compile-classpath.txt')
        f.text = sourceSets.main.compileClasspath.asPath
        println "classpath entries: " + sourceSets.main.compileClasspath.files.size()
    }
}
