pluginManagement {
    repositories {
        // ForgeGradle 7, the JarJar plugin and the Renamer plugin all publish here.
        maven { name = 'Forge'; url = 'https://maven.minecraftforge.net/' }
        // The 1.21.1 line of the Renamer plugin (1.1.x) is only on the Gradle Plugin Portal.
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    // Same as the official forge-1.21.1-52.1.x MDK: ForgeGradle's launcher tools (slime-launcher,
    // renamer) declare a Java 8 toolchain, so Gradle has to be able to provision one. This box has
    // no JDK 8 installed.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = '5zig-renewed-1.21.1-forge'
