plugins {
    id 'fabric-loom' version '1.7.4'
}

version = '4.0.0-alpha.1'
group = 'eu.the5zig.renewed'
base { archivesName = '5zig-renewed-1.20.1-fabric' }

repositories {
    mavenCentral()
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.15.11"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.92.2+1.20.1"

    // 5zig's own deps not provided by Minecraft 1.20.1
    // `implementation` puts them on the dev classpath, `include` nests the same
    // artifacts into the mod jar (jar-in-jar, listed in fabric.mod.json "jars").
    // transitive = false: only the named jar is embedded; their transitive peers
    // (netty-codec, netty-common, ...) are already shipped by Minecraft.
    implementation('com.github.5zig-reborn:DiscordIPC:master-SNAPSHOT') { exclude group: 'com.google.code.gson' }
    include('com.github.5zig-reborn:DiscordIPC:master-SNAPSHOT') { transitive = false }
    implementation 'net.sf.jacob-project:jacob:1.14.3'
    include('net.sf.jacob-project:jacob:1.14.3') { transitive = false }
    implementation 'org.json:json:20231013'
    // json-simple backs the core's own JSON parsing (DiscordRPCManager, server list). It is NOT
    // provided by Minecraft, and its absence only shows up in a packaged install — dev runs have it
    // on the classpath transitively.
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'
    // DiscordIPC talks to the Discord socket over Unix domain sockets on Linux/macOS; the library
    // is transitive-only in dev, so a packaged jar needs it nested explicitly.
    implementation 'com.kohlschutter.junixsocket:junixsocket-core:2.5.1'
    include('com.kohlschutter.junixsocket:junixsocket-core:2.5.1') { transitive = false }
    include('com.kohlschutter.junixsocket:junixsocket-common:2.5.1') { transitive = false }
    include('com.kohlschutter.junixsocket:junixsocket-native-common:2.5.1') { transitive = false }
    include('com.googlecode.json-simple:json-simple:1.1.1') { transitive = false }
    include('org.json:json:20231013') { transitive = false }
    implementation 'org.xerial:sqlite-jdbc:3.45.3.0'
    include('org.xerial:sqlite-jdbc:3.45.3.0') { transitive = false }
    // The core's conversation store is HSQLDB; without the driver on the runtime classpath
    // Class.forName('org.hsqldb.jdbc.JDBCDriver') throws and the chat stack runs on a null connection.
    implementation 'org.hsqldb:hsqldb:2.7.4'
    include('org.hsqldb:hsqldb:2.7.4') { transitive = false }
    implementation 'io.netty:netty-codec-http:4.1.97.Final'
    include('io.netty:netty-codec-http:4.1.97.Final') { transitive = false }
}

sourceSets {
    main {
        java {
            srcDirs = ['core', 'common', 'api', 'platform/1.20.1', 'loader/fabric/java']
            exclude 'eu/the5zig/mod/installer/**'
        }
        resources {
            // loader/resources holds the generated lang/<LANGVERSION>/ bundles (shared with Forge)
            srcDirs = ['core/resources', 'loader/fabric/resources', 'loader/resources']
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

// eu.the5zig.mod.Version reads these three attributes from the first
// META-INF/MANIFEST.MF that advertises "5zig-Version"; without them the HUD and
// the version string fall back to "bDEV".
def jarManifestAttributes = [
        '5zig-Version'     : project.version,
        'Minecraft-Version': minecraft_version,
        '5zig-Build'       : 'alpha',
]

tasks.named('jar') {
    manifest { attributes(jarManifestAttributes) }
}

// Loom builds the shipped artifact in remapJar; give it the same manifest so the
// attributes survive remapping.
tasks.named('remapJar') {
    manifest { attributes(jarManifestAttributes) }
}

loom {
    accessWidenerPath = file('loader/fabric/resources/5zig.accesswidener')
    runs {
        client {
            client()
            ideConfigGenerated = true
            // headless verification hook: boot straight into the test world
            programArgs '--quickPlaySingleplayer', 'New World'
        }
    }
}

tasks.register('printCompileClasspath') {
    doLast {
        def f = file('compile-classpath.txt')
        f.text = sourceSets.main.compileClasspath.asPath
        println "classpath entries: " + sourceSets.main.compileClasspath.files.size()
    }
}
