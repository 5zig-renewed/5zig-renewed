<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151A22"/>
      <stop offset="1" stop-color="#0A0C11"/>
    </linearGradient>
    <linearGradient id="amber" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFD08A"/>
      <stop offset="0.5" stop-color="#FFA126"/>
      <stop offset="1" stop-color="#EE7300"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#FF9E1B" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#FF9E1B" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
    <!-- one intentional accent arc, lower-left, well clear of the numeral -->
    <path d="M 96 356 A 190 190 0 0 0 168 434" fill="none" stroke="#FFA126"
          stroke-opacity="0.32" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- 5 : geometric construction, flat terminals, same skeleton as the original mark -->
  <path d="M 340 146 L 190 146 L 190 248 L 250 248
           A 84 84 0 1 1 172 368"
        fill="none" stroke="url(#amber)" stroke-width="64"
        stroke-linecap="butt" stroke-linejoin="miter"/>

  <!-- renewal spark, clear of the top bar -->
  <path d="M 402 114 L 410 140 L 436 148 L 410 156 L 402 182 L 394 156 L 368 148 L 394 140 Z"
        fill="#FFF3DA"/>

  <rect x="3" y="3" width="506" height="506" rx="110" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="6"/>
</svg>
