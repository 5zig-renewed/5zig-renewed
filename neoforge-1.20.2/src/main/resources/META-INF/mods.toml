modLoader="javafml"
# NeoForge 20.2.x ships FancyModLoader 1.x.
loaderVersion="[1,)"
license="GPL-3.0"

[[mods]]
modId="the5zigmod"
version="${version}"
displayName="5zig Renewed"
authors="5zig Reborn contributors, 5zig Renewed contributors"
description='''The 5zig Mod, renewed for modern Minecraft. HUD, capes, friends/chat, server tools and the plugin API. Continuation of The 5zig Mod (GPL-3.0) by 5zig Reborn.'''

# FML 1 reads mixin configs from this section (ModFileParser#getMixinConfigs).
[[mixins]]
config="mixins.the5zigmod.json"

# FML 1.0.x still uses the Forge-era `mandatory` flag; the `type` field only exists from FML 2 on.
[[dependencies.the5zigmod]]
modId="neoforge"
mandatory=true
versionRange="[20.2,20.3)"
ordering="NONE"
side="CLIENT"

[[dependencies.the5zigmod]]
modId="minecraft"
mandatory=true
versionRange="[1.20.2,1.20.3)"
ordering="NONE"
side="CLIENT"
