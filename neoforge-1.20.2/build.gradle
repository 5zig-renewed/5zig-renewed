plugins {
    // NeoForge 20.2 predates the ModDevGradle bundle: 20.2.93 ships only a Forge-format
    // -userdev jar (no moddev-config.json), which MDG 1.x and 2.x both refuse. NeoGradle
    // (net.neoforged.gradle.userdev) is the toolchain that consumes it.
    id 'net.neoforged.gradle.userdev' version '7.1.39'
}

version = '4.0.0-alpha.1'
group = 'eu.the5zig.renewed'
base { archivesName = '5zig-renewed-1.20.2-neoforge' }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

dependencies {
    implementation 'net.neoforged:neoforge:20.2.93'
}

runs {
    client {
        modSource sourceSets.main
    }
}
